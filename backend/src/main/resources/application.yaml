spring:
  application:
    name: project-management
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jira_clone}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    database: POSTGRESQL
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto:
        validate # Safe for production: verifies schema matches entities, never modifies it.
        # Use 'update' in dev (see application-dev.yaml). Use Flyway/Liquibase for prod migrations.
    show-sql: false # Overridden to true in application-dev.yaml for local debugging.
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cookie:
    secure: ${COOKIE_SECURE:true} # Set to false locally (HTTP). Must be true in production (HTTPS).

server:
  port: 8080
