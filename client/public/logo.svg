<svg width="170" height="41" viewBox="0 0 170 41" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Vibrant Cyan to Blue -->
    <linearGradient id="grad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <!-- Indigo to Deep Purple -->
    <linearGradient id="grad2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
  </defs>
  
  <!-- Modern Nexus X-Core Icon -->
  <g transform="translate(22, 20.5)">
    <!-- Back Pill -->
    <rect x="-14" y="-5" width="28" height="10" rx="5" fill="url(#grad1)" transform="rotate(45)" />
    <!-- Front Pill (slightly translucent to show overlap) -->
    <rect x="-14" y="-5" width="28" height="10" rx="5" fill="url(#grad2)" transform="rotate(-45)" opacity="0.9" />
    <!-- Center Hub Dot -->
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF" />
  </g>
  
  <!-- Premium SaaS Typography -->
  <text x="48" y="29" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="24" letter-spacing="-0.5">
    <tspan font-weight="800" fill="#0f172a">Task</tspan><tspan font-weight="600" fill="#4F46E5">Nexus</tspan>
  </text>
</svg>